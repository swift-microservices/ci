name: PR

permissions:
  contents: read

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  soundness:
    name: Soundness
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@87329d126a6992483ba89aabefa1eaef1e5b0aad  # 0.0.17
    with:
      # This repository holds workflows, their shell scripts and Markdown: no Swift or Python.
      api_breakage_check_enabled: false
      docs_check_enabled: false
      format_check_enabled: false
      python_lint_check_enabled: false

  actionlint:
    name: Workflow validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Validate workflows and their shell steps
        run: bash .github/scripts/run-actionlint.sh
