name: Attest image

# Signs the build provenance of a published image, and the SPDX SBOM of each of its platforms'
# images, and pushes the attestations to the registry beside them, so anyone pulling the image can
# verify which repository, commit and workflow built it, and what it contains, for as long as the
# image is kept (`gh attestation verify oci://<image> --owner <owner>`). A service whose repository
# GitHub stores attestations for, a public one or a private one on GitHub Enterprise Cloud, calls it
# after service.yml with its `image` output; the job that calls it grants contents: read,
# packages: write, id-token: write and attestations: write.
on:
  workflow_call:
    inputs:
      image:
        type: string
        description: The image to attest by digest, such as service.yml's image output.
        required: true
    secrets:
      REGISTRY_USERNAME:
        description: Username for a registry other than ghcr.io; ghcr.io takes GITHUB_TOKEN.
        required: false
      REGISTRY_PASSWORD:
        description: Password or token for a registry other than ghcr.io.
        required: false

jobs:
  attest:
    name: Attest image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      image_repository: ${{ steps.repository.outputs.image_repository }}
      registry: ${{ steps.repository.outputs.registry }}
      platforms: ${{ steps.platforms.outputs.platforms }}
    steps:
      - name: Find this repository's scripts
        id: scripts
        uses: $/.github/actions/scripts
      - name: Find the image
        id: repository
        env:
          IMAGE_REPOSITORY: ${{ inputs.image }}
          LOGIN: true
          REGISTRY_CREDENTIALS: ${{ secrets.REGISTRY_PASSWORD != '' }}
          SCRIPTS: ${{ steps.scripts.outputs.directory }}
        run: bash "$SCRIPTS/image-repository.sh"
      - name: Log in to the registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ${{ steps.repository.outputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
      - name: Find the image's platforms
        id: platforms
        env:
          DIGEST: ${{ steps.repository.outputs.digest }}
          IMAGE_REPOSITORY: ${{ steps.repository.outputs.image_repository }}
          SCRIPTS: ${{ steps.scripts.outputs.directory }}
        run: bash "$SCRIPTS/image-platforms.sh"
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ steps.repository.outputs.image_repository }}
          subject-digest: ${{ steps.repository.outputs.digest }}
          push-to-registry: true

  # An SBOM per platform, attested to that platform's own digest: an index holds no packages of its
  # own, and each architecture's image may hold different ones.
  sbom:
    name: Attest SBOM (${{ matrix.platform }})
    needs: [attest]
    strategy:
      matrix:
        include: ${{ fromJSON(needs.attest.outputs.platforms) }}
    # The platform's own runner, so syft reads the image as it was built.
    runs-on: ${{ startsWith(matrix.platform, 'linux/arm64') && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - name: Log in to the registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ${{ needs.attest.outputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
      # The build's SBOM artifact expires with the run's artifacts; attested, the SBOM lasts as long as
      # the image, including an older one a rollback deploys.
      - name: List the image's packages
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          image: ${{ needs.attest.outputs.image_repository }}@${{ matrix.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-name: ${{ needs.attest.outputs.image_repository }}
          subject-digest: ${{ matrix.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
