name: Library

# A Swift library's CI, for its pull_request.yml and main.yml. On a pull request: Soundness, Tests,
# Platforms, Foundation linking and, with a buf.yaml at the package's root, Protobuf. On any other
# event, such as a push to the default branch or a schedule: Tests, Platforms and Foundation
# linking, since the merged commit may differ from what the pull request tested, and a library
# resolves its dependencies' newest releases on every run. Passed fails when any of them failed,
# so a ruleset requires that one check.
#
# A library builds wherever its users do, so Tests default to swiftlang's supported releases and
# both nightlies, from the package's swift-tools-version up, on both Linux architectures. Soundness
# and Foundation linking run on the package's swift-tools-version. Its caller grants contents: read.
on:
  workflow_call:
    inputs:
      # Tests, on Linux, as swiftlang's package_test.yml names them.
      linux_swift_versions:
        type: string
        description: >-
          Swift versions to test on (JSON list): releases such as "6.3", or current, current-1,
          current-2, nightly-release and nightly-main. Empty is current-2 through nightly-main,
          without the versions below the package's swift-tools-version.
        default: ""
      linux_host_archs:
        type: string
        description: Architectures to test on, x86_64 or aarch64 (JSON list).
        default: '["x86_64", "aarch64"]'
      linux_os:
        type: string
        description: Distributions to test on, such as noble (JSON list).
        default: '["noble"]'
      linux_setup_command:
        type: string
        description: Command run before linux_command, from the repository's root.
        default: ""
      linux_command:
        type: string
        description: Command that builds and tests the package; a package without tests runs swift build.
        default: swift test
      linux_env_vars:
        type: string
        description: Environment variables the tests read (JSON object).
        default: "{}"
      postgres_image:
        type: string
        description: Postgres image started beside the tests, such as postgres:18-alpine; empty starts none.
        default: ""
      valkey_image:
        type: string
        description: Valkey image started beside the tests, such as valkey/valkey:9-alpine; empty starts none.
        default: ""
      # Platforms, built by swiftlang's package_test.yml, which can't read private dependencies.
      linux_static_sdk_build_enabled:
        type: boolean
        description: Build with the Static Linux Swift SDK.
        default: true
      wasm_sdk_build_enabled:
        type: boolean
        description: Build with the Swift SDK for Wasm.
        default: false
      android_sdk_build_enabled:
        type: boolean
        description: Build with the Swift SDK for Android, and test on its emulator.
        default: false
      windows_tests_enabled:
        type: boolean
        description: Test on Windows.
        default: false
      # Soundness, as swiftlang's soundness.yml names its checks.
      api_breakage_check_enabled:
        type: boolean
        description: Fail a pull request that breaks the public API; false while a major version 0 may break it.
        default: true
      docs_check_targets:
        type: string
        description: >-
          Targets whose documentation must build without warnings (JSON list); empty reads
          .spi.yml's documentation_targets, and checks none without it.
        default: "[]"
      docs_check_container_image:
        type: string
        description: Image the documentation check builds in; empty is the package's swift-tools-version.
        default: ""
      format_check_enabled:
        type: boolean
        description: Check the formatting against .swift-format.
        default: true
      license_header_check_enabled:
        type: boolean
        description: Check every file's license header against .license_header_template.
        default: true
      # Foundation linking.
      foundation_linking_check_enabled:
        type: boolean
        description: Fail when a product links Foundation's full library or ICU.
        default: true
      foundation_linking_check_excluded_products:
        type: string
        description: >-
          Products the Foundation linking check skips while they link Foundation through a
          dependency (JSON list); removing one checks it again.
        default: "[]"
    secrets:
      PACKAGES_TOKEN:
        description: Token with read access to the private repositories the package depends on, if any.
        required: false

permissions:
  contents: read

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      swift_version: ${{ steps.package.outputs.swift_version }}
      buf_config: ${{ steps.package.outputs.buf_config }}
      # The flags every build holds a library to, stated once. A nightly drops -warnings-as-errors,
      # since a warning a future toolchain adds mustn't fail a library that is fine today.
      swift_flags: >-
        -Xswiftc -warnings-as-errors --explicit-target-dependency-import-check error
        -Xswiftc -require-explicit-sendable
      swift_nightly_flags: --explicit-target-dependency-import-check error -Xswiftc -require-explicit-sendable
    steps:
      - name: Checkout Package.swift and buf.yaml
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            Package.swift
            buf.yaml
          sparse-checkout-cone-mode: false
      - name: Find this repository's scripts
        id: scripts
        uses: $/.github/actions/scripts
      - name: Read the toolchain and buf.yaml
        id: package
        env:
          SCRIPTS: ${{ steps.scripts.outputs.directory }}
        run: bash "$SCRIPTS/inspect-package.sh"

  soundness:
    name: Soundness
    needs: [setup]
    if: ${{ github.event_name == 'pull_request' }}
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@e8b910942e79fb2c0654a87804d8f16e2304285c  # 0.0.19
    with:
      api_breakage_check_enabled: ${{ inputs.api_breakage_check_enabled }}
      api_breakage_check_container_image: swift:${{ needs.setup.outputs.swift_version }}-noble
      docs_check_targets: ${{ join(fromJSON(inputs.docs_check_targets), ' ') }}
      docs_check_container_image: ${{ inputs.docs_check_container_image || format('swift:{0}-noble', needs.setup.outputs.swift_version) }}
      format_check_enabled: ${{ inputs.format_check_enabled }}
      format_check_container_image: swift:${{ needs.setup.outputs.swift_version }}-noble
      license_header_check_enabled: ${{ inputs.license_header_check_enabled }}

  tests:
    name: Tests
    needs: [setup]
    uses: $/.github/workflows/tests.yml
    with:
      linux_swift_versions: ${{ inputs.linux_swift_versions }}
      linux_host_archs: ${{ inputs.linux_host_archs }}
      linux_os: ${{ inputs.linux_os }}
      linux_setup_command: ${{ inputs.linux_setup_command }}
      linux_command: ${{ inputs.linux_command }}
      linux_env_vars: ${{ inputs.linux_env_vars }}
      swift_flags: ${{ needs.setup.outputs.swift_flags }}
      swift_nightly_flags: ${{ needs.setup.outputs.swift_nightly_flags }}
      postgres_image: ${{ inputs.postgres_image }}
      valkey_image: ${{ inputs.valkey_image }}
    secrets:
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

  # Every platform but Linux's tests, on swiftlang's own toolchains for each. package_test.yml names
  # its switches enable_<platform>.
  platforms:
    name: Platforms
    needs: [setup]
    if: >-
      ${{ inputs.linux_static_sdk_build_enabled || inputs.wasm_sdk_build_enabled ||
      inputs.android_sdk_build_enabled || inputs.windows_tests_enabled }}
    uses: swiftlang/github-workflows/.github/workflows/package_test.yml@e8b910942e79fb2c0654a87804d8f16e2304285c  # 0.0.19
    with:
      enable_linux: false
      enable_cxx_interop: false
      enable_macos: false
      enable_macos_swiftly: false
      enable_freebsd: false
      enable_embedded_wasm_sdk_build: false
      enable_linux_static_sdk_build: ${{ inputs.linux_static_sdk_build_enabled }}
      enable_wasm_sdk_build: ${{ inputs.wasm_sdk_build_enabled }}
      enable_android_sdk_build: ${{ inputs.android_sdk_build_enabled }}
      enable_windows: ${{ inputs.windows_tests_enabled }}
      swift_flags: ${{ needs.setup.outputs.swift_flags }}
      swift_nightly_flags: ${{ needs.setup.outputs.swift_nightly_flags }}

  foundation-linking:
    name: Foundation linking
    needs: [setup]
    if: ${{ inputs.foundation_linking_check_enabled }}
    uses: $/.github/workflows/foundation_linking.yml
    with:
      container_image: swift:${{ needs.setup.outputs.swift_version }}-noble
      excluded_products: ${{ inputs.foundation_linking_check_excluded_products }}
    secrets:
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

  # buf's own breaking check, which sees what the Swift API breakage check can't: a field renumbered
  # or a tag reused keeps the generated Swift API and breaks the wire. It runs when buf.yaml is at
  # the package's root, and compares against the pull request's base in the local clone, so a
  # private repository needs no further credentials. buf's version is an input Dependabot doesn't
  # read, so it's raised by hand.
  protobuf:
    name: Protobuf
    needs: [setup]
    if: ${{ github.event_name == 'pull_request' && needs.setup.outputs.buf_config == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Lint and check for breaking changes
        uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6  # v1.7.0
        with:
          version: 1.75.0
          lint: true
          format: false
          breaking: true
          breaking_against: .git#ref=${{ github.event.pull_request.base.sha }}
          pr_comment: false
          push: false
          archive: false

  passed:
    name: Passed
    needs: [setup, soundness, tests, platforms, foundation-linking, protobuf]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Find this repository's scripts
        id: scripts
        uses: $/.github/actions/scripts
      - name: Check every job's result
        env:
          RESULTS: ${{ toJSON(needs) }}
          SCRIPTS: ${{ steps.scripts.outputs.directory }}
        run: bash "$SCRIPTS/check-results.sh"
