name: Library

# A Swift library's whole CI. On a pull request: Soundness, Tests and Foundation linking. On a push to
# main or a scheduled run: Tests and Foundation linking, since the merged commit may differ from what
# the pull request tested and a library resolves its dependencies' newest releases on every run.
#
# Tests run on the package's swift-tools-version, Ubuntu noble and linux/arm64 unless the caller
# widens the platforms. Private dependencies are those a passed PACKAGES_TOKEN reads; tests that need
# them, or a Postgres, run in tests.yml, since swiftlang's workflow can give neither.
on:
  workflow_call:
    inputs:
      linux_swift_versions:
        type: string
        description: Swift versions to test on (JSON list); empty means the package's swift-tools-version.
        default: ""
      linux_os_versions:
        type: string
        description: Ubuntu versions to test on (JSON list).
        default: '["noble"]'
      linux_host_archs:
        type: string
        description: Architectures to test on, x86_64 or aarch64 (JSON list).
        default: '["aarch64"]'
      enable_linux_static_sdk_build:
        type: boolean
        description: Also build with the static Linux SDK, on swiftlang's versions for it.
        default: false
      linux_build_command:
        type: string
        description: What Tests runs; a package without tests uses swift build -c release.
        default: swift test -c release
      api_breakage_check_enabled:
        type: boolean
        description: Fail a pull request that breaks the public API; true from 1.0.
        default: false
      docs_check_targets:
        type: string
        description: Targets whose documentation Soundness builds (space-separated); empty builds none.
        default: ""
      foundation_linking_check_excluded_products:
        type: string
        description: >-
          Library products the Foundation linking check skips while they link Foundation through a
          dependency (space-separated); removing one checks it again.
        default: ""
      postgres_image:
        type: string
        description: Postgres image started beside the tests, such as postgres:<major>-alpine; empty starts none.
        default: ""
    secrets:
      PACKAGES_TOKEN:
        description: Token with read access to the private repositories the package depends on, if any.
        required: false

permissions:
  contents: read

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      swift_version: ${{ steps.package.outputs.swift_version }}
      private_dependencies: ${{ steps.package.outputs.private_dependencies }}
    steps:
      - name: Checkout Package.swift
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: Package.swift
          sparse-checkout-cone-mode: false
      - name: Find this repository's scripts
        id: scripts
        uses: $/.github/actions/scripts
      - name: Read the toolchain and private dependencies
        id: package
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          SCRIPTS: ${{ steps.scripts.outputs.directory }}
        run: bash "$SCRIPTS/inspect-package.sh"

  soundness:
    name: Soundness
    if: ${{ github.event_name == 'pull_request' }}
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@87329d126a6992483ba89aabefa1eaef1e5b0aad  # 0.0.17
    with:
      api_breakage_check_enabled: ${{ inputs.api_breakage_check_enabled }}
      docs_check_enabled: ${{ inputs.docs_check_targets != '' }}
      docs_check_targets: ${{ inputs.docs_check_targets }}

  tests:
    name: Tests
    needs: [setup]
    if: ${{ inputs.postgres_image == '' && needs.setup.outputs.private_dependencies != 'true' }}
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@87329d126a6992483ba89aabefa1eaef1e5b0aad  # 0.0.17
    with:
      linux_swift_versions: ${{ inputs.linux_swift_versions || format('["{0}"]', needs.setup.outputs.swift_version) }}
      linux_os_versions: ${{ inputs.linux_os_versions }}
      linux_host_archs: ${{ inputs.linux_host_archs }}
      linux_build_command: ${{ inputs.linux_build_command }}
      swift_flags: -Xswiftc -warnings-as-errors --explicit-target-dependency-import-check error -Xswiftc -require-explicit-sendable
      swift_nightly_flags: --explicit-target-dependency-import-check error -Xswiftc -require-explicit-sendable
      enable_linux_static_sdk_build: ${{ inputs.enable_linux_static_sdk_build }}
      enable_windows_checks: false

  package-tests:
    name: Tests
    needs: [setup]
    if: ${{ inputs.postgres_image != '' || needs.setup.outputs.private_dependencies == 'true' }}
    uses: $/.github/workflows/tests.yml
    with:
      linux_swift_versions: ${{ inputs.linux_swift_versions || format('["{0}"]', needs.setup.outputs.swift_version) }}
      linux_os_versions: ${{ inputs.linux_os_versions }}
      linux_host_archs: ${{ inputs.linux_host_archs }}
      linux_build_command: ${{ inputs.linux_build_command }}
      swift_flags: -Xswiftc -warnings-as-errors --explicit-target-dependency-import-check error -Xswiftc -require-explicit-sendable
      swift_nightly_flags: --explicit-target-dependency-import-check error -Xswiftc -require-explicit-sendable
      postgres_image: ${{ inputs.postgres_image }}
    secrets:
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

  # The static Linux SDK build for a package whose tests run in package-tests; it can't fetch private dependencies.
  static-sdk:
    name: Static Linux SDK
    needs: [setup]
    if: ${{ inputs.enable_linux_static_sdk_build && (inputs.postgres_image != '' || needs.setup.outputs.private_dependencies == 'true') }}
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@87329d126a6992483ba89aabefa1eaef1e5b0aad  # 0.0.17
    with:
      enable_linux_checks: false
      enable_linux_static_sdk_build: true
      linux_os_versions: ${{ inputs.linux_os_versions }}
      enable_windows_checks: false
      swift_flags: -Xswiftc -warnings-as-errors --explicit-target-dependency-import-check error -Xswiftc -require-explicit-sendable
      swift_nightly_flags: --explicit-target-dependency-import-check error -Xswiftc -require-explicit-sendable

  foundation-linking:
    name: Foundation linking
    needs: [setup]
    uses: $/.github/workflows/foundation_linking.yml
    with:
      container_image: swift:${{ needs.setup.outputs.swift_version }}-noble
      excluded_products: ${{ inputs.foundation_linking_check_excluded_products }}
    secrets:
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
