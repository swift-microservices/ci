name: Deploy (deprecated)

# Deprecated: call deploy_dokploy.yml. Kept with 0.1.0's inputs so a caller moving its pin keeps
# working; removed in the next major release. The job deploy_dokploy.yml runs is still named
# Deploy <environment>, which the production gate looks for.
on:
  workflow_call:
    inputs:
      environment:
        type: string
        description: staging or production.
        required: true
      commit:
        type: string
        description: Commit whose image to deploy; empty means the commit the run is for, the latest on main.
        default: ""
      image_repository:
        type: string
        description: Where the image was published, such as ghcr.io/<owner>/<repository>.
        required: true
      application_ids:
        type: string
        description: The Dokploy applications that run the image in this environment, in deploy order (JSON list).
        required: true
    secrets:
      DOKPLOY_URL:
        required: true
      DOKPLOY_TOKEN:
        required: true

# Permissions are inherited from the caller, as in 0.1.0.
jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    uses: $/.github/workflows/deploy_dokploy.yml
    with:
      environment: ${{ inputs.environment }}
      commit: ${{ inputs.commit }}
      image_repository: ${{ inputs.image_repository }}
      application_ids: ${{ inputs.application_ids }}
    secrets:
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
