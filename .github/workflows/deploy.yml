name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        type: string
        description: staging or production.
        required: true
      commit:
        type: string
        description: Commit whose image to deploy; empty means the commit the run is for, the latest on main.
        default: ""
      image_repository:
        type: string
        description: Where build-image.yml published the image, such as ghcr.io/<owner>/<repository>.
        required: true
      application_ids:
        type: string
        description: >-
          The IDs of the Dokploy applications that run the image in this environment, in deploy
          order (JSON list).
        required: true
    secrets:
      DOKPLOY_URL:
        required: true
      DOKPLOY_TOKEN:
        required: true

# Permissions are inherited: callers grant contents: read, actions: read, and packages: read.
jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve the commit's image
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ inputs.commit || github.sha }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          IMAGE_REPOSITORY: ${{ inputs.image_repository }}
        run: |
          case "$TARGET_ENVIRONMENT" in
            staging|production) ;;
            *) echo "::error::Unknown environment '$TARGET_ENVIRONMENT'"; exit 1 ;;
          esac
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$COMMIT" --jq .sha)

          # Production runs only a commit whose push to main deployed it to staging.
          if [ "$TARGET_ENVIRONMENT" = production ]; then
            staged=false
            running=false
            while read -r run status; do
              if [ "$status" != completed ]; then
                running=true
              fi
              if [ -n "$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs" \
                --jq '.jobs[] | select((.name | endswith("Deploy staging")) and .conclusion == "success") | .id')" ]; then
                staged=true
              fi
            done < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&event=push" \
              --jq '.workflow_runs[] | "\(.id) \(.status)"')
            if [ "$staged" != true ] && [ "$running" = true ]; then
              echo "::error::${sha::7} is still on its way to staging; deploy it once that run finishes"
              exit 1
            fi
            if [ "$staged" != true ]; then
              echo "::error::${sha::7} has no successful staging deployment"
              exit 1
            fi
          fi

          # The commit tag names the image in Dokploy; the digest pins what Docker pulls.
          if ! manifest=$(docker buildx imagetools inspect "$IMAGE_REPOSITORY:$sha" --format '{{json .Manifest}}'); then
            echo "::error::$IMAGE_REPOSITORY has no image for ${sha::7}"
            exit 1
          fi
          digest=$(jq -r .digest <<<"$manifest")
          case "$digest" in sha256:*) ;; *) exit 1 ;; esac
          echo "commit=$sha" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE_REPOSITORY:$sha@$digest" >> "$GITHUB_OUTPUT"
          echo "Deploying ${sha::7} ($IMAGE_REPOSITORY@$digest) to $TARGET_ENVIRONMENT"

      - name: Deploy each Dokploy application in order
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          APPLICATION_IDS: ${{ inputs.application_ids }}
          IMAGE: ${{ steps.resolve.outputs.image }}
          COMMIT: ${{ steps.resolve.outputs.commit }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          api="${DOKPLOY_URL%/}/api"
          # Calls one procedure of Dokploy's API; a body makes it a POST.
          dokploy() {
            local procedure=$1 body=${2:-}
            if [ -n "$body" ]; then
              curl --fail-with-body --silent --show-error --connect-timeout 15 --max-time 120 \
                --header "x-api-key: $DOKPLOY_TOKEN" --header 'Content-Type: application/json' \
                --data "$body" "$api/$procedure"
            else
              curl --fail-with-body --silent --show-error --connect-timeout 15 --max-time 30 \
                --retry 3 --retry-all-errors --header "x-api-key: $DOKPLOY_TOKEN" "$api/$procedure"
            fi
          }
          newest_deployment() {
            dokploy "deployment.allByType?id=$1&type=application" | jq -c '.[0] // {}'
          }

          # Every ID must name an application before any of them changes.
          if ! jq -e 'type == "array" and length > 0 and all(.[]; type == "string" and length > 0)' \
            <<<"$APPLICATION_IDS" > /dev/null 2>&1; then
            echo '::error::application_ids must be a non-empty JSON list of application IDs'
            exit 1
          fi
          ids=()
          while read -r id; do
            ids+=("$id")
          done < <(jq -r '.[]' <<<"$APPLICATION_IDS")
          names=()
          for id in "${ids[@]}"; do
            name=$(dokploy "application.one?applicationId=$id" 2>/dev/null | jq -r '.name // empty' 2>/dev/null) || true
            if [ -z "$name" ]; then
              echo "::error::Dokploy has no application $id that this token can read"
              exit 1
            fi
            names+=("$name")
          done

          # One application at a time; a failure leaves the rest on their current image.
          for i in "${!ids[@]}"; do
            id=${ids[i]}
            name=${names[i]}
            echo "::group::$name"
            previous=$(newest_deployment "$id" | jq -r '.deploymentId // ""')

            result=$(dokploy application.update "$(jq -nc --arg id "$id" --arg image "$IMAGE" \
              '{applicationId: $id, dockerImage: $image}')") || result="${result:-request failed}"
            if [ "$result" != true ]; then
              echo "::error::Dokploy did not set the image of $name: $result"
              exit 1
            fi

            # Dokploy queues each application's deployments, so asking twice is harmless.
            request=$(jq -nc --arg id "$id" --arg title "${COMMIT::7}" --arg description "$COMMIT $RUN_URL" \
              '{applicationId: $id, title: $title, description: $description}')
            for attempt in 1 2 3 4 5; do
              code=$(curl --silent --output /dev/null --write-out '%{http_code}' --connect-timeout 15 --max-time 120 \
                --header "x-api-key: $DOKPLOY_TOKEN" --header 'Content-Type: application/json' \
                --data "$request" "$api/application.deploy") || code="no response"
              case "$code" in
                200) break ;;
                429|5??|"no response") ;;
                *) echo "::error::Dokploy refused to deploy $name (HTTP $code)"; exit 1 ;;
              esac
              if [ "$attempt" -eq 5 ]; then
                echo "::error::Dokploy did not accept the deployment of $name after 5 attempts ($code)"
                exit 1
              fi
              echo "Attempt $attempt to deploy $name got $code; retrying"
              sleep $((attempt * 15))
            done

            # Wait for a deployment newer than the one before the request to finish.
            deadline=$((SECONDS + 900))
            status=""
            while [ "$SECONDS" -lt "$deadline" ]; do
              sleep 5
              deployment=$(newest_deployment "$id" 2>/dev/null) || continue
              if [ "$(jq -r '.deploymentId // ""' <<<"$deployment")" = "$previous" ]; then
                continue
              fi
              status=$(jq -r '.status // ""' <<<"$deployment")
              case "$status" in
                "done") break ;;
                error|cancelled)
                  echo "::error::Dokploy's deployment of $name ended $status; its log is in Dokploy"
                  exit 1
                  ;;
              esac
            done
            if [ "$status" != "done" ]; then
              echo "::error::Dokploy's deployment of $name did not finish within 15 minutes"
              exit 1
            fi
            echo "$name runs $IMAGE"
            echo "::endgroup::"
          done
