name: Tests

# swiftlang/github-workflows' swift_package_test.yml for a package that needs what that workflow can't
# give: private dependencies, since it takes no secrets (swiftlang/github-workflows#59), or a Postgres
# beside the tests, since it starts no service containers. This one runs the same Linux job, with the
# same input names, after giving SwiftPM a token when there is one and starting Postgres when an image
# is given. A package that needs neither calls swiftlang's workflow directly.
on:
  workflow_call:
    inputs:
      linux_swift_versions:
        type: string
        description: Swift versions to test with (JSON list).
        default: '["6.3"]'
      linux_os_versions:
        type: string
        description: Ubuntu versions to test on (JSON list).
        default: '["noble"]'
      linux_host_archs:
        type: string
        description: Host architectures, x86_64 or aarch64 (JSON list).
        default: '["aarch64"]'
      linux_pre_build_command:
        type: string
        description: Command to run before the build command.
        default: ""
      linux_build_command:
        type: string
        description: Command that builds and tests the package; swift_flags are appended.
        default: swift test
      swift_flags:
        type: string
        description: Flags appended to the build command.
        default: ""
      swift_nightly_flags:
        type: string
        description: Flags appended to the build command on nightly toolchains; empty uses swift_flags.
        default: ""
      postgres_image:
        type: string
        description: >-
          Postgres image started beside the tests, such as postgres:18-alpine; empty starts none. The
          tests reach it through POSTGRES_HOST, POSTGRES_PORT, POSTGRES_USER, POSTGRES_PASSWORD, and
          POSTGRES_DB.
        default: ""
    secrets:
      PACKAGES_TOKEN:
        description: Token with read access to the private repositories the package depends on, if any.
        required: false

permissions:
  contents: read

jobs:
  linux:
    name: Linux (${{ matrix.swift_version }} - ${{ matrix.os_version }} - ${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        swift_version: ${{ fromJson(inputs.linux_swift_versions) }}
        os_version: ${{ fromJson(inputs.linux_os_versions) }}
        arch: ${{ fromJson(inputs.linux_host_archs) }}
    container:
      image: ${{ contains(matrix.swift_version, 'nightly') && 'swiftlang/swift' || 'swift' }}:${{ matrix.swift_version }}-${{ matrix.os_version }}
    services:
      postgres:
        # An empty image starts no service.
        image: ${{ inputs.postgres_image }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Give SwiftPM the token
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          if [ -z "$PACKAGES_TOKEN" ]; then
            echo 'No PACKAGES_TOKEN: the package has only public dependencies'
            exit 0
          fi
          printf 'machine github.com login x-access-token password %s\n' "$PACKAGES_TOKEN" > "$HOME/.netrc"
          chmod 600 "$HOME/.netrc"
      - name: Point the tests at Postgres
        # Only when Postgres runs: a test that checks whether POSTGRES_HOST is set then skips without it.
        if: ${{ inputs.postgres_image != '' }}
        run: |
          {
            echo 'POSTGRES_HOST=postgres'
            echo 'POSTGRES_PORT=5432'
            echo 'POSTGRES_USER=postgres'
            echo 'POSTGRES_PASSWORD=postgres'
            echo 'POSTGRES_DB=postgres'
          } >> "$GITHUB_ENV"
      - name: Pre-build
        if: ${{ inputs.linux_pre_build_command != '' }}
        run: ${{ inputs.linux_pre_build_command }}
      - name: Build and test
        run: >-
          ${{ inputs.linux_build_command }}
          ${{ (contains(matrix.swift_version, 'nightly') && inputs.swift_nightly_flags) || inputs.swift_flags }}
