name: Tests

# Runs a package's tests on Linux, once for each toolchain swiftlang's toolchain_matrix.yml lists,
# as swiftlang's package_test.yml does, with what package_test.yml can't give: the private
# dependencies PACKAGES_TOKEN reads (swiftlang/github-workflows#59), and a Postgres or a Valkey
# beside the tests. Its inputs keep package_test.yml's names, formats and defaults, and add only
# postgres_image and valkey_image. Each toolchain runs in its Swift image, on a runner of its
# architecture, so nothing runs under emulation.
on:
  workflow_call:
    inputs:
      linux_swift_versions:
        type: string
        description: >-
          Swift versions to test on (JSON list): releases such as "6.3", or current, current-1,
          current-2, nightly-release and nightly-main. Empty is current-2 through nightly-main.
          Versions below the package's swift-tools-version are left out.
        default: ""
      linux_host_archs:
        type: string
        description: Architectures to test on, x86_64 or aarch64 (JSON list).
        default: '["x86_64"]'
      linux_os:
        type: string
        description: Distributions the Swift images are tagged for, such as noble (JSON list).
        default: '["noble"]'
      linux_setup_command:
        type: string
        description: Command run before linux_command, from the repository's root.
        default: ""
      linux_command:
        type: string
        description: Command that builds and tests the package; swift_flags or swift_nightly_flags are appended.
        default: swift test
      linux_env_vars:
        type: string
        description: Environment variables the tests read (JSON object).
        default: "{}"
      swift_flags:
        type: string
        description: Flags appended to linux_command on a release toolchain.
        default: ""
      swift_nightly_flags:
        type: string
        description: Flags appended to linux_command on a nightly toolchain.
        default: ""
      postgres_image:
        type: string
        description: >-
          Postgres image started beside the tests, such as postgres:18-alpine; empty starts none. The
          tests reach it through POSTGRES_HOST, POSTGRES_PORT, POSTGRES_USER, POSTGRES_PASSWORD and
          POSTGRES_DB.
        default: ""
      valkey_image:
        type: string
        description: >-
          Valkey image started beside the tests, such as valkey/valkey:9-alpine; empty starts none.
          The tests reach it through VALKEY_HOST and VALKEY_PORT.
        default: ""
    secrets:
      PACKAGES_TOKEN:
        description: Token with read access to the private repositories the package depends on, if any.
        required: false

permissions:
  contents: read

jobs:
  toolchains:
    name: Toolchains
    uses: swiftlang/github-workflows/.github/workflows/toolchain_matrix.yml@e8b910942e79fb2c0654a87804d8f16e2304285c  # 0.0.19
    with:
      linux_swift_versions: ${{ inputs.linux_swift_versions }}
      linux_host_archs: ${{ inputs.linux_host_archs }}
      linux_os: ${{ inputs.linux_os }}
      linux_use_docker: true

  prepare:
    name: Prepare tests
    needs: [toolchains]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      include: ${{ steps.prepare.outputs.include }}
      environment: ${{ steps.prepare.outputs.environment }}
    steps:
      - name: Find this repository's scripts
        id: scripts
        uses: $/.github/actions/scripts
      - name: Prepare the matrix and environment
        id: prepare
        env:
          MATRIX_YAML: ${{ needs.toolchains.outputs.matrix_yaml }}
          SWIFT_FLAGS: ${{ inputs.swift_flags }}
          SWIFT_NIGHTLY_FLAGS: ${{ inputs.swift_nightly_flags }}
          LINUX_ENV_VARS: ${{ inputs.linux_env_vars }}
          POSTGRES_IMAGE: ${{ inputs.postgres_image }}
          VALKEY_IMAGE: ${{ inputs.valkey_image }}
          SCRIPTS: ${{ steps.scripts.outputs.directory }}
        run: bash "$SCRIPTS/prepare-tests.sh"

  linux:
    name: ${{ matrix.name }}
    needs: [prepare]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.include) }}
    container:
      image: ${{ matrix.image }}
    services:
      postgres:
        # An empty image starts no service.
        image: ${{ inputs.postgres_image }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        # An empty image starts no service.
        image: ${{ inputs.valkey_image }}
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Find this repository's scripts
        id: scripts
        uses: $/.github/actions/scripts
      - name: Give SwiftPM the token
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          SCRIPTS: ${{ steps.scripts.outputs.directory }}
        run: bash "$SCRIPTS/configure-netrc.sh"
      - name: Set the tests' environment
        env:
          ENVIRONMENT: ${{ needs.prepare.outputs.environment }}
          SCRIPTS: ${{ steps.scripts.outputs.directory }}
        run: bash "$SCRIPTS/export-environment.sh"
      - name: Set up
        if: ${{ inputs.linux_setup_command != '' }}
        run: ${{ inputs.linux_setup_command }}
      - name: Build and test
        run: ${{ inputs.linux_command }} ${{ matrix.flags }}
