name: Clean up images (deprecated)

# Deprecated: call cleanup_images.yml. Kept with 0.1.0's inputs so a caller moving its pin keeps
# working; removed in the next major release.
on:
  workflow_call:
    inputs:
      package_name:
        type: string
        description: The container package, usually the repository name.
        required: true
      min_versions_to_keep:
        type: number
        description: How many of the newest image versions to keep.
        default: 30

# Permissions are inherited from the caller, as in 0.1.0.
jobs:
  cleanup:
    name: Delete old image versions
    uses: $/.github/workflows/cleanup_images.yml
    with:
      package_name: ${{ inputs.package_name }}
      min_versions_to_keep: ${{ inputs.min_versions_to_keep }}
