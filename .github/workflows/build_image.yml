name: Build image

on:
  workflow_call:
    inputs:
      executable_product:
        type: string
        description: The executable product the image runs as its entrypoint.
        required: true
      image_repository:
        type: string
        description: >-
          Where the image is published, lowercase; empty publishes to ghcr.io/<owner>/<repository>,
          lowercased.
        default: ""
      containerfile_target:
        type: string
        description: Containerfile stage to build; empty builds the last one.
        default: ""
      linux_host_archs:
        type: string
        description: Architectures to build the image for, x86_64 or aarch64 (JSON list).
        required: true
      publish:
        type: boolean
        description: Push the validated image as :<commit-sha>; allowed only on main.
        default: false
    secrets:
      PACKAGES_TOKEN:
        description: >-
          Token with read access to the private repositories the package depends on, passed as
          the `netrc` build secret.
        required: false

# Permissions are inherited: pull request callers grant contents: read; publishing callers also
# grant packages: write.
jobs:
  # One image per architecture, each built once and checked on a runner of its own architecture, so
  # nothing runs under emulation. Publishing pushes each by digest alone, untagged; the image job
  # then writes the commit's one tag over all of them.
  build:
    name: Build image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJson(inputs.linux_host_archs) }}
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Find this repository's scripts
        id: scripts
        uses: $/.github/actions/scripts
      - name: Find the image repository
        id: repository
        env:
          IMAGE_REPOSITORY: ${{ inputs.image_repository }}
          SCRIPTS: ${{ steps.scripts.outputs.directory }}
        run: bash "$SCRIPTS/image-repository.sh"
      - name: Find the image's platform
        id: platform
        env:
          HOST_ARCH: ${{ matrix.arch }}
          SCRIPTS: ${{ steps.scripts.outputs.directory }}
        run: bash "$SCRIPTS/image-platform.sh"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Log in to GitHub Container Registry
        if: ${{ inputs.publish }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The OCI labels GHCR shows on the package page, read from the repository: its URL as
      # org.opencontainers.image.source, which links the package to it from the first push so the
      # package inherits its access, its description and its license, and the commit as .revision.
      # Only the labels are used; the commit's tag is the image job's alone.
      - name: Read the image's labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ steps.repository.outputs.image_repository }}
          tags: type=sha,format=long,prefix=
      # Built once. A pull request loads the image locally and pushes nothing. Publishing pushes it by
      # digest, untagged, with OCI media types, which an index's annotations need, and the checks
      # below then run on that pushed image, so the image checked is the image published; the
      # commit's tag is written only once every architecture passes. Attestations are
      # attest_image.yml's, so the build adds none of buildx's own.
      - name: Build release image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Containerfile
          target: ${{ inputs.containerfile_target }}
          platforms: ${{ steps.platform.outputs.platform }}
          load: ${{ !inputs.publish }}
          push: false
          tags: ${{ !inputs.publish && format('service-ci:{0}', github.sha) || '' }}
          outputs: >-
            ${{ inputs.publish &&
            format('type=image,name={0},push-by-digest=true,name-canonical=true,oci-mediatypes=true,push=true',
            steps.repository.outputs.image_repository) || '' }}
          provenance: false
          sbom: false
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=service-image-${{ matrix.arch }}
          cache-to: type=gha,scope=service-image-${{ matrix.arch }},mode=max
          # Mounted by the Containerfile for `swift package resolve` only; it never enters a layer.
          secrets: >-
            ${{ secrets.PACKAGES_TOKEN != '' &&
            format('netrc=machine github.com login x-access-token password {0}', secrets.PACKAGES_TOKEN) || '' }}
      - name: Find the image to check
        id: image
        env:
          PUBLISH: ${{ inputs.publish }}
          LOCAL_IMAGE: service-ci:${{ github.sha }}
          IMAGE_REPOSITORY: ${{ steps.repository.outputs.image_repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SCRIPTS: ${{ steps.scripts.outputs.directory }}
        run: bash "$SCRIPTS/find-image-to-check.sh"
      - name: Check the user and runtime libraries
        env:
          CI_IMAGE: ${{ steps.image.outputs.image }}
          EXECUTABLE_PRODUCT: ${{ inputs.executable_product }}
          SCRIPTS: ${{ steps.scripts.outputs.directory }}
        run: bash "$SCRIPTS/check-image.sh"
      # The image's packages, kept with the run, so a vulnerability found later can be checked against
      # what shipped.
      - name: List the image's packages
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          image: ${{ steps.image.outputs.image }}
          format: spdx-json
          artifact-name: sbom-${{ github.sha }}-${{ matrix.arch }}.spdx.json
          upload-release-assets: false
      # Only a critical vulnerability with a fixed version fails the build, and only a pull request's:
      # one with no fix yet would block every deploy without a way forward, and publishing reports
      # without failing, so a vulnerability disclosed after the pull request passed never blocks a
      # deploy or a hotfix.
      - name: Scan the image for vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        with:
          image: ${{ steps.image.outputs.image }}
          fail-build: ${{ !inputs.publish }}
          severity-cutoff: critical
          only-fixed: true
          output-format: table
      - name: Keep the checked digest
        if: ${{ inputs.publish }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          DIGESTS_DIRECTORY: ${{ runner.temp }}/digests
          SCRIPTS: ${{ steps.scripts.outputs.directory }}
        run: bash "$SCRIPTS/keep-image-digest.sh"
      - name: Upload the checked digest
        if: ${{ inputs.publish }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: image-digest-${{ github.sha }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  # The one check every caller requires, whatever the architectures: it passes only when every
  # architecture's build passed, and, when publishing, tags the commit's image.
  image:
    name: Build and validate image
    needs: [build]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Find this repository's scripts
        id: scripts
        uses: $/.github/actions/scripts
      - name: Check every architecture's build
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          SCRIPTS: ${{ steps.scripts.outputs.directory }}
        run: bash "$SCRIPTS/check-image-builds.sh"
      - name: Find the image repository
        id: repository
        if: ${{ inputs.publish }}
        env:
          IMAGE_REPOSITORY: ${{ inputs.image_repository }}
          SCRIPTS: ${{ steps.scripts.outputs.directory }}
        run: bash "$SCRIPTS/image-repository.sh"
      - name: Set up Docker Buildx
        if: ${{ inputs.publish }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Log in to GitHub Container Registry
        if: ${{ inputs.publish }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Find whether the commit's image is published
        id: published
        if: ${{ inputs.publish }}
        env:
          IMAGE_REPOSITORY: ${{ steps.repository.outputs.image_repository }}
          SCRIPTS: ${{ steps.scripts.outputs.directory }}
        run: bash "$SCRIPTS/image-published.sh"
      - name: Download the pushed digests
        if: ${{ inputs.publish && steps.published.outputs.published == 'false' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: image-digest-${{ github.sha }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      # The platform images' labels again, as annotations on the index several architectures share,
      # where GHCR reads a multi-architecture image's.
      - name: Read the index's annotations
        id: meta
        if: ${{ inputs.publish && steps.published.outputs.published == 'false' }}
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ steps.repository.outputs.image_repository }}
          tags: type=sha,format=long,prefix=
      - name: Publish the image
        if: ${{ inputs.publish && steps.published.outputs.published == 'false' }}
        env:
          DIGESTS_DIRECTORY: ${{ runner.temp }}/digests
          IMAGE_REPOSITORY: ${{ steps.repository.outputs.image_repository }}
          ANNOTATIONS: ${{ steps.meta.outputs.annotations }}
          SCRIPTS: ${{ steps.scripts.outputs.directory }}
        run: bash "$SCRIPTS/publish-image.sh"
