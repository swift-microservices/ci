name: Build image

# Builds the Containerfile once for each architecture linux_host_archs lists, each on a runner of
# its own architecture, so nothing runs under emulation, and checks each image: it runs as an
# unprivileged user, and the executable its entrypoint starts finds every runtime library it links.
# Each image's SPDX SBOM is kept as an artifact and scanned; only a critical vulnerability with a
# fixed version fails, and only a build that doesn't push. With push: true, each image is pushed by
# digest, untagged, the checks run on the pushed image, and its digest is kept as an artifact for
# the job that tags the commit's image.
#
# service.yml calls it on every event, pushing on the default branch. Permissions are inherited: a
# caller that pushes grants contents: read and packages: write, one that doesn't contents: read.
on:
  workflow_call:
    inputs:
      linux_host_archs:
        type: string
        description: Architectures to build the image for, x86_64 or aarch64 (JSON list).
        required: true
      image_repository:
        type: string
        description: Where the image is pushed, lowercase; empty is ghcr.io/<owner>/<repository>, lowercased.
        default: ""
      containerfile:
        type: string
        description: Path of the Containerfile or Dockerfile, from the repository's root.
        default: Containerfile
      containerfile_target:
        type: string
        description: Stage to build; empty builds the last one.
        default: ""
      push:
        type: boolean
        description: Push each architecture's image by digest, untagged, and keep the digest as an artifact.
        default: false
    secrets:
      PACKAGES_TOKEN:
        description: >-
          Token with read access to the private repositories the package depends on, passed as the
          `netrc` build secret.
        required: false
      REGISTRY_USERNAME:
        description: Username for a registry other than ghcr.io; ghcr.io takes GITHUB_TOKEN.
        required: false
      REGISTRY_PASSWORD:
        description: Password or token for a registry other than ghcr.io.
        required: false

jobs:
  build:
    name: Build image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.linux_host_archs) }}
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Find this repository's scripts
        id: scripts
        uses: $/.github/actions/scripts
      - name: Find the image repository
        id: repository
        env:
          IMAGE_REPOSITORY: ${{ inputs.image_repository }}
          LOGIN: ${{ inputs.push }}
          REGISTRY_CREDENTIALS: ${{ secrets.REGISTRY_PASSWORD != '' }}
          SCRIPTS: ${{ steps.scripts.outputs.directory }}
        run: bash "$SCRIPTS/image-repository.sh"
      - name: Find the image's platform
        id: platform
        env:
          HOST_ARCH: ${{ matrix.arch }}
          SCRIPTS: ${{ steps.scripts.outputs.directory }}
        run: bash "$SCRIPTS/image-platform.sh"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Log in to the registry
        if: ${{ inputs.push }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ${{ steps.repository.outputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
      # The OCI labels a registry shows, read from the repository: its URL as
      # org.opencontainers.image.source, which links a GHCR package to it from the first push so the
      # package inherits its access, its description and its license, and the commit as .revision.
      # Only the labels are used; the commit's tag is the publishing job's alone.
      - name: Read the image's labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ steps.repository.outputs.image_repository }}
          tags: type=sha,format=long,prefix=
      # Built once. Without push, the image is loaded locally and nothing leaves the runner. With
      # push, it's pushed by digest, untagged, with OCI media types, which an index's annotations
      # need, and the checks below run on that pushed image, so the image checked is the image
      # published. Attestations are attest_image.yml's, so the build adds none of buildx's own.
      - name: Build the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ${{ inputs.containerfile }}
          target: ${{ inputs.containerfile_target }}
          platforms: ${{ steps.platform.outputs.platform }}
          load: ${{ !inputs.push }}
          push: false
          tags: ${{ !inputs.push && format('ci-image:{0}', github.sha) || '' }}
          outputs: >-
            ${{ inputs.push &&
            format('type=image,name={0},push-by-digest=true,name-canonical=true,oci-mediatypes=true,push=true',
            steps.repository.outputs.image_repository) || '' }}
          provenance: false
          sbom: false
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,scope=image-${{ matrix.arch }},mode=max
          # Mounted by the Containerfile for `swift package resolve` only; it never enters a layer.
          secrets: >-
            ${{ secrets.PACKAGES_TOKEN != '' &&
            format('netrc=machine github.com login x-access-token password {0}', secrets.PACKAGES_TOKEN) || '' }}
      - name: Find the image to check
        id: image
        env:
          PUSH: ${{ inputs.push }}
          LOCAL_IMAGE: ci-image:${{ github.sha }}
          IMAGE_REPOSITORY: ${{ steps.repository.outputs.image_repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SCRIPTS: ${{ steps.scripts.outputs.directory }}
        run: bash "$SCRIPTS/find-image-to-check.sh"
      - name: Check the user and runtime libraries
        env:
          CI_IMAGE: ${{ steps.image.outputs.image }}
          SCRIPTS: ${{ steps.scripts.outputs.directory }}
        run: bash "$SCRIPTS/check-image.sh"
      # The image's packages, kept with the run, so a vulnerability found later can be checked against
      # what shipped.
      - name: List the image's packages
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          image: ${{ steps.image.outputs.image }}
          format: spdx-json
          artifact-name: sbom-${{ github.sha }}-${{ matrix.arch }}.spdx.json
          upload-release-assets: false
      # Only a critical vulnerability with a fixed version fails the build, and only one that doesn't
      # push: one with no fix yet would block every deploy without a way forward, and a vulnerability
      # disclosed after the pull request passed mustn't block a deploy or a hotfix.
      - name: Scan the image for vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        with:
          image: ${{ steps.image.outputs.image }}
          fail-build: ${{ !inputs.push }}
          severity-cutoff: critical
          only-fixed: true
          output-format: table
      - name: Keep the checked digest
        if: ${{ inputs.push }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          DIGESTS_DIRECTORY: ${{ runner.temp }}/digests
          SCRIPTS: ${{ steps.scripts.outputs.directory }}
        run: bash "$SCRIPTS/keep-image-digest.sh"
      - name: Upload the checked digest
        if: ${{ inputs.push }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: image-digest-${{ github.sha }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          overwrite: true
          retention-days: 1
