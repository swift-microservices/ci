name: Service

# A Swift service's whole CI. On a pull request: Soundness, Tests, Foundation linking, a validated
# image and, with openapi_breakage_check_path, OpenAPI breakage. On a push to main: Tests and
# Foundation linking, then the image published once as :<commit-sha>. Any other run validates the
# image without publishing it. Soundness, Tests and Foundation linking run on the package's
# swift-tools-version, the toolchain its Containerfile builds with. Tests and the image cover each
# architecture linux_host_archs lists, aarch64 by default; several share one published index.
#
# Deployment isn't part of it: the service's CI workflow calls a deployment workflow, such as
# deploy_dokploy.yml, after this one. The caller grants contents: read and packages: write, since a
# called workflow can't hold more than its caller gives it.
on:
  workflow_call:
    inputs:
      executable_product:
        type: string
        description: The executable product the image runs and the Foundation linking check builds.
        required: true
      image_repository:
        type: string
        description: Where the image is published, such as ghcr.io/<owner>/<repository>.
        required: true
      containerfile_target:
        type: string
        description: Containerfile stage to build; empty builds the last one.
        default: ""
      linux_host_archs:
        type: string
        description: >-
          Architectures the tests run on and the image is built for, x86_64 or aarch64 (JSON list):
          the ones the deployment's servers run.
        default: '["aarch64"]'
      license_header_check_enabled:
        type: boolean
        description: Check every file's license header against .license_header_template.
        default: true
      postgres_image:
        type: string
        description: Postgres image started beside the tests, such as postgres:<major>-alpine; empty starts none.
        default: ""
      valkey_image:
        type: string
        description: Valkey image started beside the tests, such as valkey/valkey:<major>-alpine; empty starts none.
        default: ""
      foundation_linking_check_excluded_products:
        type: string
        description: >-
          Products the Foundation linking check skips while they link Foundation through a
          dependency, usually executable_product (JSON list); removing one checks it again.
        default: "[]"
      openapi_breakage_check_path:
        type: string
        description: >-
          Path of the OpenAPI document the service serves, such as Sources/<Target>/openapi.yaml; a
          pull request that breaks its clients against the base fails. Empty checks none.
        default: ""
    secrets:
      PACKAGES_TOKEN:
        description: Token with read access to the private repositories the package depends on, if any.
        required: false

permissions:
  contents: read

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      swift_version: ${{ steps.package.outputs.swift_version }}
    steps:
      - name: Checkout Package.swift
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: Package.swift
          sparse-checkout-cone-mode: false
      - name: Find this repository's scripts
        id: scripts
        uses: $/.github/actions/scripts
      - name: Read the toolchain
        id: package
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          SCRIPTS: ${{ steps.scripts.outputs.directory }}
        run: bash "$SCRIPTS/inspect-package.sh"

  soundness:
    name: Soundness
    needs: [setup]
    if: ${{ github.event_name == 'pull_request' }}
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@e8b910942e79fb2c0654a87804d8f16e2304285c  # 0.0.19
    with:
      api_breakage_check_enabled: false
      license_header_check_enabled: ${{ inputs.license_header_check_enabled }}
      docs_check_enabled: false
      format_check_container_image: swift:${{ needs.setup.outputs.swift_version }}-noble

  tests:
    name: Tests
    needs: [setup]
    uses: $/.github/workflows/tests.yml
    with:
      linux_swift_versions: ${{ format('["{0}"]', needs.setup.outputs.swift_version) }}
      linux_os_versions: '["noble"]'
      linux_host_archs: ${{ inputs.linux_host_archs }}
      linux_build_command: swift test --disable-automatic-resolution
      swift_flags: -Xswiftc -warnings-as-errors --explicit-target-dependency-import-check error
      postgres_image: ${{ inputs.postgres_image }}
      valkey_image: ${{ inputs.valkey_image }}
    secrets:
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

  foundation-linking:
    name: Foundation linking
    needs: [setup]
    uses: $/.github/workflows/foundation_linking.yml
    with:
      container_image: swift:${{ needs.setup.outputs.swift_version }}-noble
      executable_products: ${{ format('["{0}"]', inputs.executable_product) }}
      excluded_products: ${{ inputs.foundation_linking_check_excluded_products }}
    secrets:
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

  # oasdiff's breaking check, which sees what compiling the service can't: an operation removed, a
  # parameter made required or a response narrowed still builds and breaks every client generated from
  # the previous document. It compares against the pull request's base in the local clone, fails on a
  # definite break (ERR), uploads nothing and comments nothing.
  openapi-breakage:
    name: OpenAPI breakage
    if: ${{ github.event_name == 'pull_request' && inputs.openapi_breakage_check_path != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Find this repository's scripts
        id: scripts
        uses: $/.github/actions/scripts
      - name: Find the document in the base
        id: base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          OPENAPI_PATH: ${{ inputs.openapi_breakage_check_path }}
          SCRIPTS: ${{ steps.scripts.outputs.directory }}
        run: bash "$SCRIPTS/find-openapi-base.sh"
      - name: Check for breaking changes
        if: ${{ steps.base.outputs.found == 'true' }}
        uses: oasdiff/oasdiff-action/breaking@14ca7009a63c417dfe27b7c44359c4bcccaf8eee  # v0.2.1
        with:
          base: ${{ github.event.pull_request.base.sha }}:${{ inputs.openapi_breakage_check_path }}
          revision: ${{ inputs.openapi_breakage_check_path }}
          fail-on: ERR
          review: false
          github-token: ""

  image:
    name: Build image
    if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
    uses: $/.github/workflows/build_image.yml
    with:
      executable_product: ${{ inputs.executable_product }}
      image_repository: ${{ inputs.image_repository }}
      containerfile_target: ${{ inputs.containerfile_target }}
      linux_host_archs: ${{ inputs.linux_host_archs }}
    secrets:
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

  publish:
    name: Publish image
    needs: [tests, foundation-linking]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      packages: write
    uses: $/.github/workflows/build_image.yml
    with:
      executable_product: ${{ inputs.executable_product }}
      image_repository: ${{ inputs.image_repository }}
      containerfile_target: ${{ inputs.containerfile_target }}
      linux_host_archs: ${{ inputs.linux_host_archs }}
      publish: true
    secrets:
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
