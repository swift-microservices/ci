name: Service

# A Swift service's CI, for its pull_request.yml and main.yml. On a pull request: Soundness, Tests,
# Foundation linking, the image built and checked without leaving the runner, and, with
# openapi_breakage_check_path, OpenAPI breakage. On a push to the default branch: Tests, Foundation
# linking and the image, pushed by digest, then, once all three pass, published as :<commit-sha>
# and named by the `image` output, which a deployment workflow takes. Passed fails when any of them
# failed, so a ruleset requires that one check.
#
# A service runs on its servers alone, so it tests and builds only for the architectures they run,
# which it states in linux_host_archs, and on one toolchain, the package's swift-tools-version, which
# its Containerfile builds with too.
#
# Deployment isn't part of it: the service's main.yml calls a deployment workflow, such as
# deploy_dokploy.yml, with the `image` output. Permissions are inherited: pull_request.yml grants
# contents: read, main.yml contents: read and packages: write.
on:
  workflow_call:
    inputs:
      linux_host_archs:
        type: string
        description: >-
          Architectures the service's servers run, x86_64 or aarch64 (JSON list): the tests run on
          each, and the image is built for each.
        required: true
      # Tests, on Linux, as swiftlang's package_test.yml names them.
      linux_setup_command:
        type: string
        description: Command run before linux_command, from the repository's root.
        default: ""
      linux_command:
        type: string
        description: Command that builds and tests the package, at its committed Package.resolved.
        default: swift test --disable-automatic-resolution
      linux_env_vars:
        type: string
        description: Environment variables the tests read (JSON object).
        default: "{}"
      postgres_image:
        type: string
        description: Postgres image started beside the tests, such as postgres:18-alpine; empty starts none.
        default: ""
      valkey_image:
        type: string
        description: Valkey image started beside the tests, such as valkey/valkey:9-alpine; empty starts none.
        default: ""
      # Soundness, as swiftlang's soundness.yml names its checks.
      format_check_enabled:
        type: boolean
        description: Check the formatting against .swift-format.
        default: true
      license_header_check_enabled:
        type: boolean
        description: Check every file's license header against .license_header_template.
        default: true
      # Foundation linking.
      foundation_linking_check_enabled:
        type: boolean
        description: Fail when a product links Foundation's full library or ICU.
        default: true
      foundation_linking_check_excluded_products:
        type: string
        description: >-
          Products the Foundation linking check skips while they link Foundation through a
          dependency (JSON list); removing one checks it again.
        default: "[]"
      # OpenAPI breakage.
      openapi_breakage_check_path:
        type: string
        description: >-
          Path of the OpenAPI document the service serves, such as Sources/<Target>/openapi.yaml; a
          pull request that breaks its clients against the base fails. Empty checks none.
        default: ""
      # Image.
      image_repository:
        type: string
        description: Where the image is published, lowercase; empty is ghcr.io/<owner>/<repository>, lowercased.
        default: ""
      containerfile:
        type: string
        description: Path of the Containerfile or Dockerfile, from the repository's root.
        default: Containerfile
      containerfile_target:
        type: string
        description: Stage to build; empty builds the last one.
        default: ""
    secrets:
      PACKAGES_TOKEN:
        description: Token with read access to the private repositories the package depends on, if any.
        required: false
      REGISTRY_USERNAME:
        description: Username for a registry other than ghcr.io; ghcr.io takes GITHUB_TOKEN.
        required: false
      REGISTRY_PASSWORD:
        description: Password or token for a registry other than ghcr.io.
        required: false
    outputs:
      image:
        description: >-
          The image published by a push to the default branch, <image_repository>:<commit-sha>@sha256:<hex>;
          empty on any other run.
        value: ${{ jobs.publish.outputs.image }}

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      swift_version: ${{ steps.package.outputs.swift_version }}
      publish: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    steps:
      - name: Checkout Package.swift
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: Package.swift
          sparse-checkout-cone-mode: false
      - name: Find this repository's scripts
        id: scripts
        uses: $/.github/actions/scripts
      - name: Read the toolchain
        id: package
        env:
          SCRIPTS: ${{ steps.scripts.outputs.directory }}
        run: bash "$SCRIPTS/inspect-package.sh"

  soundness:
    name: Soundness
    needs: [setup]
    if: ${{ github.event_name == 'pull_request' }}
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@e8b910942e79fb2c0654a87804d8f16e2304285c  # 0.0.19
    with:
      api_breakage_check_enabled: false
      docs_check_enabled: false
      format_check_enabled: ${{ inputs.format_check_enabled }}
      format_check_container_image: swift:${{ needs.setup.outputs.swift_version }}-noble
      license_header_check_enabled: ${{ inputs.license_header_check_enabled }}

  # The flags hold the commit to no warnings. The image build passes none, so a warning a newer
  # toolchain adds never blocks a deploy or a hotfix.
  tests:
    name: Tests
    needs: [setup]
    uses: $/.github/workflows/tests.yml
    with:
      linux_swift_versions: '["${{ needs.setup.outputs.swift_version }}"]'
      linux_host_archs: ${{ inputs.linux_host_archs }}
      linux_setup_command: ${{ inputs.linux_setup_command }}
      linux_command: ${{ inputs.linux_command }}
      linux_env_vars: ${{ inputs.linux_env_vars }}
      swift_flags: -Xswiftc -warnings-as-errors --explicit-target-dependency-import-check error
      postgres_image: ${{ inputs.postgres_image }}
      valkey_image: ${{ inputs.valkey_image }}
    secrets:
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

  foundation-linking:
    name: Foundation linking
    needs: [setup]
    if: ${{ inputs.foundation_linking_check_enabled }}
    uses: $/.github/workflows/foundation_linking.yml
    with:
      container_image: swift:${{ needs.setup.outputs.swift_version }}-noble
      excluded_products: ${{ inputs.foundation_linking_check_excluded_products }}
    secrets:
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

  # oasdiff's breaking check, which sees what compiling the service can't: an operation removed, a
  # parameter made required or a response narrowed still builds and breaks every client generated from
  # the previous document. It compares against the pull request's base in the local clone, fails on a
  # definite break (ERR), uploads nothing and comments nothing.
  openapi-breakage:
    name: OpenAPI breakage
    if: ${{ github.event_name == 'pull_request' && inputs.openapi_breakage_check_path != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Find this repository's scripts
        id: scripts
        uses: $/.github/actions/scripts
      - name: Find the document in the base
        id: base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          OPENAPI_PATH: ${{ inputs.openapi_breakage_check_path }}
          SCRIPTS: ${{ steps.scripts.outputs.directory }}
        run: bash "$SCRIPTS/find-openapi-base.sh"
      - name: Check for breaking changes
        if: ${{ steps.base.outputs.found == 'true' }}
        uses: oasdiff/oasdiff-action/breaking@14ca7009a63c417dfe27b7c44359c4bcccaf8eee  # v0.2.1
        with:
          base: ${{ github.event.pull_request.base.sha }}:${{ inputs.openapi_breakage_check_path }}
          revision: ${{ inputs.openapi_breakage_check_path }}
          fail-on: ERR
          review: false
          github-token: ""

  # Built beside the tests. On the default branch each architecture's image is pushed by digest,
  # untagged, and only publish names it, once the tests pass.
  image:
    name: Image
    needs: [setup]
    uses: $/.github/workflows/build_image.yml
    with:
      linux_host_archs: ${{ inputs.linux_host_archs }}
      image_repository: ${{ inputs.image_repository }}
      containerfile: ${{ inputs.containerfile }}
      containerfile_target: ${{ inputs.containerfile_target }}
      push: ${{ needs.setup.outputs.publish == 'true' }}
    secrets:
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}

  publish:
    name: Publish
    needs: [setup, tests, foundation-linking, image]
    if: ${{ !failure() && !cancelled() && needs.setup.outputs.publish == 'true' }}
    uses: $/.github/workflows/publish_image.yml
    with:
      image_repository: ${{ inputs.image_repository }}
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}

  passed:
    name: Passed
    needs: [setup, soundness, tests, foundation-linking, openapi-breakage, image, publish]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Find this repository's scripts
        id: scripts
        uses: $/.github/actions/scripts
      - name: Check every job's result
        env:
          RESULTS: ${{ toJSON(needs) }}
          SCRIPTS: ${{ steps.scripts.outputs.directory }}
        run: bash "$SCRIPTS/check-results.sh"
