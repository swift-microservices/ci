name: Service

# A Swift service's whole CI and delivery to staging. On a pull request: Soundness, Tests, Foundation
# linking and a validated image. On a push to main: Tests and Foundation linking, then the image
# published once as :<commit-sha>, then deployed to staging. Any other run validates the image without
# publishing it. Production is the service's own manual workflow, calling deploy.yml.
#
# The caller grants contents: read, packages: write and actions: read: a called workflow can't hold
# more than its caller gives it.
on:
  workflow_call:
    inputs:
      service_product:
        type: string
        description: The executable product the image runs and Foundation linking checks.
        required: true
      image_repository:
        type: string
        description: Where the image is published, such as ghcr.io/<owner>/<repository>.
        required: true
      staging_application_ids:
        type: string
        description: The Dokploy applications that run the image on staging, in deploy order (JSON list).
        required: true
      swift_version:
        type: string
        description: The toolchain the tests and Foundation linking use; the Containerfile's matches it.
        default: "6.3"
      build_target:
        type: string
        description: Containerfile stage to build; empty builds the last one.
        default: ""
      postgres_image:
        type: string
        description: Postgres image started beside the tests, such as postgres:18-alpine; empty starts none.
        default: ""
      excluded_products:
        type: string
        description: >-
          service_product while it still links Foundation through a dependency. It isn't checked then;
          removing it from the list checks it again.
        default: ""
    secrets:
      PACKAGES_TOKEN:
        description: Token with read access to the private repositories the package depends on, if any.
        required: false
      DOKPLOY_URL:
        required: false
      DOKPLOY_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  soundness:
    name: Soundness
    if: ${{ github.event_name == 'pull_request' }}
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@87329d126a6992483ba89aabefa1eaef1e5b0aad  # 0.0.17
    with:
      api_breakage_check_enabled: false
      docs_check_enabled: false

  tests:
    name: Tests
    uses: $/.github/workflows/tests.yml
    with:
      linux_swift_versions: ${{ format('["{0}"]', inputs.swift_version) }}
      linux_os_versions: '["noble"]'
      linux_host_archs: '["aarch64"]'
      linux_build_command: swift test --disable-automatic-resolution
      swift_flags: -Xswiftc -warnings-as-errors --explicit-target-dependency-import-check error
      postgres_image: ${{ inputs.postgres_image }}
    secrets:
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

  foundation-linking:
    name: Foundation linking
    uses: $/.github/workflows/foundation-linking.yml
    with:
      container_image: swift:${{ inputs.swift_version }}-noble
      executable_products: ${{ inputs.service_product }}
      excluded_products: ${{ inputs.excluded_products }}
    secrets:
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

  image:
    name: Build image
    if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
    uses: $/.github/workflows/build-image.yml
    with:
      service_product: ${{ inputs.service_product }}
      image_repository: ${{ inputs.image_repository }}
      build_target: ${{ inputs.build_target }}
    secrets:
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

  publish:
    name: Publish image
    needs: [tests, foundation-linking]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      packages: write
    uses: $/.github/workflows/build-image.yml
    with:
      service_product: ${{ inputs.service_product }}
      image_repository: ${{ inputs.image_repository }}
      build_target: ${{ inputs.build_target }}
      publish: true
    secrets:
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

  staging:
    name: Staging
    needs: [publish]
    permissions:
      contents: read
      actions: read
      packages: read
    uses: $/.github/workflows/deploy.yml
    with:
      environment: staging
      image_repository: ${{ inputs.image_repository }}
      application_ids: ${{ inputs.staging_application_ids }}
    secrets:
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
