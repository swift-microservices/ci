name: PR label

# A semver label on every pull request: this repository's own check, and the one a library calls
# from its pull_request_label.yml on each pull request and label change. The job that calls it
# grants contents: read and pull-requests: read.
on:
  pull_request:
    types: [labeled, unlabeled, opened, reopened, synchronize]
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  semver-label-check:
    name: Semver label
    uses: swiftlang/github-workflows/.github/workflows/pull_request_label.yml@e8b910942e79fb2c0654a87804d8f16e2304285c  # 0.0.19
