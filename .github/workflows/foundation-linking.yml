name: Foundation linking

# Checks that a package's products link neither Foundation's full library nor ICU, so code that
# imports FoundationEssentials keeps services small. It builds an empty executable depending on every
# library product, and each executable product named in executable_products, and fails when one of
# them links Foundation. Builds are dynamic, since ldd sees nothing in a static binary.
# swiftlang/github-workflows has no such check.
on:
  workflow_call:
    inputs:
      container_image:
        type: string
        description: Image with the Swift toolchain that builds the check.
        default: swift:6.3-noble
      excluded_products:
        type: string
        description: >-
          Products, library or executable, that still link Foundation through a dependency
          (space-separated). They aren't checked; removing one from the list checks it again.
        default: ""
      executable_products:
        type: string
        description: Executable products to check as well, such as a service's (space-separated).
        default: ""
    secrets:
      PACKAGES_TOKEN:
        description: Token with read access to the private repositories the package depends on, if any.
        required: false

permissions:
  contents: read

jobs:
  foundation-linking:
    name: Foundation linking
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ${{ inputs.container_image }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Find this repository's scripts
        id: scripts
        uses: $/.github/actions/scripts
      - name: Give SwiftPM the token
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          SCRIPTS: ${{ steps.scripts.outputs.directory }}
        run: bash "$SCRIPTS/configure-netrc.sh"
      - name: Check the products
        env:
          EXCLUDED_PRODUCTS: ${{ inputs.excluded_products }}
          EXECUTABLE_PRODUCTS: ${{ inputs.executable_products }}
          SCRIPTS: ${{ steps.scripts.outputs.directory }}
        run: bash "$SCRIPTS/check-foundation-linking.sh"
