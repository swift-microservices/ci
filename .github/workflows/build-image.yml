name: Build image

on:
  workflow_call:
    inputs:
      service_product:
        type: string
        description: The executable product the image runs as its entrypoint.
        required: true
      image_repository:
        type: string
        description: Where the image is published, such as ghcr.io/<owner>/<repository>.
        required: true
      build_target:
        type: string
        description: Containerfile stage to build; empty builds the last one.
        default: ""
      publish:
        type: boolean
        description: Push the validated image as :<commit-sha>; allowed only on main.
        default: false
    secrets:
      PACKAGES_TOKEN:
        description: >-
          Token with read access to the private repositories the package depends on, passed as
          the `netrc` build secret.
        required: false

# Permissions are inherited: pull request callers grant contents: read; publishing callers also
# grant packages: write.
jobs:
  image:
    name: Build and validate image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Build release image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Containerfile
          target: ${{ inputs.build_target }}
          platforms: linux/arm64
          load: true
          push: false
          tags: service-ci:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=service-image
          cache-to: type=gha,scope=service-image,mode=max
          # Mounted by the Containerfile for `swift package resolve` only; it never enters a layer.
          secrets: >-
            ${{ secrets.PACKAGES_TOKEN != '' &&
            format('netrc=machine github.com login x-access-token password {0}', secrets.PACKAGES_TOKEN) || '' }}
      - name: Check the user and runtime libraries
        env:
          CI_IMAGE: service-ci:${{ github.sha }}
          SERVICE_PRODUCT: ${{ inputs.service_product }}
        run: |
          image_user=$(docker image inspect --format '{{.Config.User}}' "$CI_IMAGE")
          case "$image_user" in
            ""|root|root:*|0|0:*) echo '::error::The image must run as an unprivileged user'; exit 1 ;;
          esac

          if linkage=$(docker run --rm --entrypoint ldd "$CI_IMAGE" "/app/$SERVICE_PRODUCT" 2>&1); then
            printf '%s\n' "$linkage"
            if [[ $linkage == *'not found'* ]]; then
              echo '::error::A runtime library is missing from the image'
              exit 1
            fi
          elif [[ $linkage == *'not a dynamic executable'* || $linkage == *'statically linked'* ]]; then
            printf '%s\n' "$linkage"
          else
            printf '%s\n' "$linkage" >&2
            exit 1
          fi
      - name: Log in to GitHub Container Registry
        if: ${{ inputs.publish }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the image
        if: ${{ inputs.publish }}
        env:
          CI_IMAGE: service-ci:${{ github.sha }}
          IMAGE_REPOSITORY: ${{ inputs.image_repository }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Images are published only from main, not $GITHUB_REF"
            exit 1
          fi
          commit_tag="$IMAGE_REPOSITORY:$GITHUB_SHA"
          # A commit's tag is written once, so a re-run never replaces the image staging ran.
          if docker buildx imagetools inspect "$commit_tag" > /dev/null 2>&1; then
            echo "$commit_tag is already published"
            exit 0
          fi
          docker tag "$CI_IMAGE" "$commit_tag"
          docker push "$commit_tag"
