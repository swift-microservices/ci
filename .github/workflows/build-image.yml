name: Build image (deprecated)

# Deprecated: call build_image.yml, or a service's whole CI through service.yml. Kept with 0.1.0's
# inputs so a caller moving its pin keeps working; removed in the next major release.
on:
  workflow_call:
    inputs:
      service_product:
        type: string
        description: The executable product the image runs as its entrypoint.
        required: true
      image_repository:
        type: string
        description: Where the image is published, such as ghcr.io/<owner>/<repository>.
        required: true
      build_target:
        type: string
        description: Containerfile stage to build; empty builds the last one.
        default: ""
      publish:
        type: boolean
        description: Push the validated image as :<commit-sha>; allowed only on main.
        default: false
    secrets:
      PACKAGES_TOKEN:
        description: Token with read access to the private repositories the package depends on.
        required: false

# Permissions are inherited from the caller, as in 0.1.0.
jobs:
  image:
    name: Build and validate image
    uses: $/.github/workflows/build_image.yml
    with:
      executable_product: ${{ inputs.service_product }}
      image_repository: ${{ inputs.image_repository }}
      containerfile_target: ${{ inputs.build_target }}
      publish: ${{ inputs.publish }}
    secrets:
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
